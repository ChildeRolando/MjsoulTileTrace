<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视觉何切分析器｜科学日麻牌效率</title>
  <link rel="stylesheet" href="assets/course.css">
</head>
<body>
  <main class="page">
    <nav class="topbar"><a href="index.html">← 课程首页</a><span>普通手精确分析</span></nav>
    <header class="hero"><div><p class="eyebrow">VISUAL ANALYZER</p><h1>点选十四张牌</h1><p class="lead">不输入数字字母。分析器按“舍牌后向听数 → 直接剩余枚数”列出候选，并展示每一打的有效牌。</p></div><div class="hero-number">算</div></header>
    <section class="lesson-section">
      <div class="tool-panel">
        <h2>牌面</h2>
        <div id="tile-palette" class="tile-palette" aria-label="三十四种麻将牌"></div>
        <h2>当前手牌 <span id="hand-count">0 / 14</span></h2>
        <div id="selected-hand" class="hand-builder tile-rack" aria-live="polite"></div>
        <div class="action-row">
          <button class="action" id="analyze-button">分析舍牌</button>
          <button class="action secondary" id="sample-button">载入示例</button>
          <button class="action secondary" id="clear-button">清空手牌</button>
        </div>
        <p class="note">范围：只计算普通四面子一雀头；不计算七对子、国士无双、防守、打点或场况。</p>
      </div>
    </section>
    <section class="lesson-section">
      <h2>候选排名</h2>
      <div id="analysis-results"><p>点满十四张牌后开始分析。</p></div>
    </section>
  </main>
  <script type="module" src="assets/analyzer.js"></script>
</body>
</html>
