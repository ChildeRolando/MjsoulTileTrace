<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>综合色何切训练｜科学日麻牌效率</title>
  <link rel="stylesheet" href="assets/course.css">
</head>
<body>
  <main class="page">
    <nav class="topbar"><a href="index.html">← 课程首页</a><span id="drill-score">正确 0 / 0</span></nav>
    <header class="hero"><div><p class="eyebrow">MIXED DRILLS · 240 VARIANTS</p><h1>看牌，点舍牌</h1><p class="lead">二十个基础结构经六种花色置换与镜像扩展为二百四十手。每题先在三秒内作答，再阅读精确向听与有效牌反馈。</p></div><div class="hero-number">练</div></header>
    <section class="lesson-section">
      <div class="tool-panel">
        <div class="drill-meta"><strong id="drill-number">变体 1 / 240</strong><span id="drill-timer">0.0 秒</span></div>
        <p id="lifetime-stats">累计 0 手｜近百手 0%｜近五十手中位 —</p>
        <div id="drill-hand" class="drill-hand" aria-label="请选择要舍弃的牌"></div>
        <div id="drill-feedback" class="feedback" aria-live="polite">点击一张牌作答。</div>
        <div class="action-row"><button class="action" id="next-drill" disabled>下一题</button><button class="action secondary" id="restart-drills">本轮从头</button><a class="action secondary" href="mastery.html">查看掌握仪表板</a></div>
      </div>
    </section>
    <section class="lesson-section">
      <h2>训练规则</h2>
      <ol>
        <li>系统只判定向听数与直接剩余枚数两层。</li>
        <li>多个舍牌同为最优时全部算正确；再用课程中的牌形质量、二次改良破平。</li>
        <li>答错不要连点改答案。先口述自己漏掉的有效牌，再进入下一题。</li>
      </ol>
    </section>
  </main>
  <script type="module" src="assets/trainer.js"></script>
</body>
</html>
