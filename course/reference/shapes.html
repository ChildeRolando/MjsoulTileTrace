<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>常见牌形视觉图鉴</title>
  <link rel="stylesheet" href="../assets/course.css">
  <style>@media print { .reference-jump { display:none } }.shape-row{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}@media(max-width:600px){.shape-row{grid-template-columns:1fr}}</style>
</head>
<body>
  <main class="page">
    <nav class="topbar reference-jump"><a href="../index.html">← 课程首页</a><span>视觉图鉴</span></nav>
    <header class="hero"><div><p class="eyebrow">REFERENCE 04</p><h1>高频牌形图鉴</h1><p class="lead">口诀只是精确计算的缓存。</p></div><div class="hero-number">04</div></header>
    <section class="lesson-section">
      <div class="shape-row"><div><strong>两面</strong><br>通常八枚</div><div class="tile-rack" role="img" aria-label="三四万接受二万与五万"><span class="tile-group"><span class="tile-wrap"><img class="tile" src="../assets/tiles/3m.svg" alt="三万"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/4m.svg" alt="四万"></span><span class="tile-wrap effective"><span class="tile-badge">进</span><img class="tile" src="../assets/tiles/2m.svg" alt="有效牌二万"></span><span class="tile-wrap effective"><span class="tile-badge">进</span><img class="tile" src="../assets/tiles/5m.svg" alt="有效牌五万"></span></span></div></div>
      <div class="shape-row"><div><strong>嵌张</strong><br>通常四枚</div><div class="tile-rack" role="img" aria-label="三五筒接受四筒"><span class="tile-group"><span class="tile-wrap"><img class="tile" src="../assets/tiles/3p.svg" alt="三筒"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/5p.svg" alt="五筒"></span><span class="tile-wrap effective"><span class="tile-badge">进</span><img class="tile" src="../assets/tiles/4p.svg" alt="有效牌四筒"></span></span></div></div>
      <div class="shape-row"><div><strong>边张</strong><br>通常四枚</div><div class="tile-rack" role="img" aria-label="一二索接受三索"><span class="tile-group"><span class="tile-wrap"><img class="tile" src="../assets/tiles/1s.svg" alt="一索"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/2s.svg" alt="二索"></span><span class="tile-wrap effective"><span class="tile-badge">进</span><img class="tile" src="../assets/tiles/3s.svg" alt="有效牌三索"></span></span></div></div>
      <div class="shape-row"><div><strong>四连形</strong><br>双两面方向</div><div class="tile-rack" role="img" aria-label="三四五六万四连形"><span class="tile-group"><span class="tile-wrap"><img class="tile" src="../assets/tiles/3m.svg" alt="三万"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/4m.svg" alt="四万"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/5m.svg" alt="五万"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/6m.svg" alt="六万"></span></span></div></div>
      <div class="shape-row"><div><strong>中膨形</strong><br>顺子与对子共享</div><div class="tile-rack" role="img" aria-label="三四四五筒中膨形"><span class="tile-group"><span class="tile-wrap"><img class="tile" src="../assets/tiles/3p.svg" alt="三筒"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/4p.svg" alt="四筒"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/4p.svg" alt="四筒"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/5p.svg" alt="五筒"></span></span></div></div>
      <div class="shape-row"><div><strong>强化搭子</strong><br>两面、对子、顺子</div><div class="tile-rack" role="img" aria-label="二三三四索强化搭子"><span class="tile-group"><span class="tile-wrap"><img class="tile" src="../assets/tiles/2s.svg" alt="二索"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/3s.svg" alt="三索"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/3s.svg" alt="三索"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/4s.svg" alt="四索"></span></span></div></div>
      <div class="shape-row"><div><strong>相邻双对</strong><br>双碰并可转顺子</div><div class="tile-rack" role="img" aria-label="五六万相邻双对"><span class="tile-group"><span class="tile-wrap"><img class="tile" src="../assets/tiles/5m.svg" alt="五万"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/5m.svg" alt="五万"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/6m.svg" alt="六万"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/6m.svg" alt="六万"></span></span></div></div>
    </section>
  </main>
</body>
</html>
