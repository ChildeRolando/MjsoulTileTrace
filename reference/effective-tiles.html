<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>有效牌与剩余枚数｜图像速查</title>
  <link rel="stylesheet" href="../assets/course.css">
  <style>@media print { .reference-jump { display:none } }</style>
</head>
<body>
  <main class="page">
    <nav class="topbar reference-jump"><a href="../index.html">← 课程首页</a><span>可打印速查</span></nav>
    <header class="hero"><div><p class="eyebrow">REFERENCE 01</p><h1>有效牌与剩余枚数</h1><p class="lead">何切第一层的四步算法。</p></div><div class="hero-number">01</div></header>
    <section class="lesson-section">
      <div class="concept-grid">
        <article class="concept"><strong>第一步：枚举候选舍牌</strong>优先看浮牌、弱搭子与重复功能牌，先缩小候选。</article>
        <article class="concept"><strong>第二步：保持最低向听</strong>退向听候选先退出纯效率比较。</article>
        <article class="concept"><strong>第三步：列出有效牌</strong>不同拆法共享的牌种只写一次。</article>
        <article class="concept"><strong>第四步：扣除已知牌</strong>手牌、牌河和副露中的同种牌全部扣除。</article>
      </div>
      <div class="principle">剩余枚数 ＝ 四张 − 手牌同种牌 − 公开同种牌</div>
    </section>
    <section class="lesson-section">
      <h2>划掉已知牌</h2>
      <p>二三索两面接受一索和四索。若一索已见一张、四索已见两张：</p>
      <div class="tile-rack" role="img" aria-label="二三索两面"><span class="tile-group"><span class="tile-wrap"><img class="tile" src="../assets/tiles/2s.svg" alt="二索"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/3s.svg" alt="三索"></span></span></div>
      <div class="tile-rack" role="img" aria-label="一索四张，其中一张已知"><span class="tile-group"><span class="tile-wrap known"><img class="tile" src="../assets/tiles/1s.svg" alt="已知的一索"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/1s.svg" alt="一索"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/1s.svg" alt="一索"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/1s.svg" alt="一索"></span></span></div>
      <div class="tile-rack" role="img" aria-label="四索四张，其中两张已知"><span class="tile-group"><span class="tile-wrap known"><img class="tile" src="../assets/tiles/4s.svg" alt="已知的四索"></span><span class="tile-wrap known"><img class="tile" src="../assets/tiles/4s.svg" alt="已知的四索"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/4s.svg" alt="四索"></span><span class="tile-wrap"><img class="tile" src="../assets/tiles/4s.svg" alt="四索"></span></span></div>
      <div class="calculation">一索 3 枚 ＋ 四索 2 枚 ＝ 实际 5 枚</div>
    </section>
  </main>
</body>
</html>
