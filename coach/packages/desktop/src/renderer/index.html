<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>日麻教练</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">RIICHI COACH · 国区</p>
      <h1>雀魂账号</h1>
      <p id="status" aria-live="polite">正在读取本地会话…</p>
      <p id="detail" class="detail">令牌仅加密保存在这台设备上。</p>
      <div class="actions">
        <button id="login" type="button">登录雀魂</button>
        <button id="logout" type="button" class="secondary" hidden>退出账号</button>
        <button id="refresh" type="button" class="quiet">刷新状态</button>
      </div>
      <section class="catalog" hidden>
        <div class="catalog-head">
          <h2>可分析牌谱</h2>
          <button id="sync" type="button" class="quiet">同步最近牌谱</button>
        </div>
        <p id="catalog-detail" class="detail">仅显示四人南风标准规则的可分析对局。</p>
        <ul id="catalog-list" class="catalog-list"></ul>
      </section>
      <section class="paipu-import" hidden>
        <h2>通过牌谱链接分析</h2>
        <p class="detail">粘贴雀魂牌谱分享链接并选择你的座位；应用会通过本机的雀魂客户端会话读取牌谱。</p>
        <div class="paipu-form">
          <input id="paipu-url" type="text" inputmode="url" autocomplete="off"
                 placeholder="https://game.maj-soul.com/1/?paipu=…"
                 aria-label="雀魂牌谱分享链接">
          <select id="paipu-self-actor" aria-label="你的座位">
            <option value="" selected>选择座位</option>
            <option value="0">座位 0</option>
            <option value="1">座位 1</option>
            <option value="2">座位 2</option>
            <option value="3">座位 3</option>
          </select>
          <button id="paipu-import" type="button">导入并分析</button>
        </div>
        <p id="paipu-status" class="detail" aria-live="polite">粘贴雀魂牌谱分享链接并选择你的座位。</p>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
