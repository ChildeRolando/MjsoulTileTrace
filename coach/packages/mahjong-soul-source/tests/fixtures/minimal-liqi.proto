syntax = "proto3";

package lq;

message Wrapper {
  string name = 1;
  bytes data = 2;
}

message ReqLogin {
  string account = 1;
  string password = 2;
  uint32 type = 3;
}

message ReqOauth2Login {
  string access_token = 1;
  uint32 type = 2;
}

message ResLogin {
  uint64 account_id = 1;
  string access_token = 2;
  bytes proof = 3;
}

message ReqEmpty {}
message ResEmpty {}

message ReqGameRecord {
  string game_uuid = 1;
}

message ResGameRecord {
  uint64 record_id = 1;
  bytes data = 2;
}

message ReqDeleteAccount {
  string confirmation = 1;
}

message NotifyRoom {
  string room = 1;
  bytes marker = 2;
}
