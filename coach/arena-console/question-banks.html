<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arena Lab · 题库生成</title><link rel="stylesheet" href="/style.css"><script type="module" src="/question-banks.mjs"></script></head><body class="flat-page"><a class="skip" href="#main">跳转到题库生成</a><aside class="rail"></aside><main id="main"><header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> 题库生成</div><a class="quiet-button" href="/">返回实验控制台</a></header><div class="content"><div class="heading"><div><h1>题库生成</h1><p>生成合法局面，保存为可重复评测的题库批次。</p></div><span id="sync-status" role="status">正在连接本机服务</span></div><div id="message" class="message" role="status" hidden></div>
<section class="panel settings-panel"><h2>新建批次</h2><p class="field-hint">生成过程不调用 Coach 模型。达到时限时保留已完成题目；生成题库属于开发资料。</p><form id="generation-form"><div class="form-grid"><label>题目类型<select id="generation-preset"><option value="flat">平面何切 · 基础牌效</option><option value="spatial">立体何切 · 立直／副露</option><option value="conflict">牌效率与保留宝牌冲突</option></select></label><label>目标题量<input id="generation-count" type="number" min="1" max="128" value="20" required></label><label>随机种子<input id="generation-seed" type="number" min="0" max="4294967295" value="20261022" required></label><label>生成时限（秒）<input id="generation-time" type="number" min="10" max="1800" value="300" required></label></div><button id="generate" class="primary-button" type="submit">开始生成</button></form></section>
<section class="panel inline-catalog"><div class="panel-heading"><h2>已保存批次</h2><button id="refresh-banks" class="text-button">刷新批次</button></div><label>选择批次<select id="saved-bank"></select></label><p id="bank-summary" class="field-hint"></p><div class="catalog-actions"><a id="use-bank" class="quiet-button" href="/">前往评测与预览</a><button id="resume-generation" class="quiet-button" hidden>继续未完成的生成</button></div></section>
<section class="panel inline-catalog"><div class="panel-heading"><h2>当前任务</h2><button id="stop" class="quiet-button" disabled>停止任务</button></div><div id="job-content"></div></section><footer class="page-footer"><span>ARENA LAB / 本机实验工作台</span><span>真实归档 · 可追溯复查</span></footer></div></main></body></html>
