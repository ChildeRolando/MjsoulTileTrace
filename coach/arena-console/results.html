<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arena Lab · 实验结果</title><link rel="stylesheet" href="/style.css"><script type="module" src="/results.mjs"></script></head><body class="flat-page results-page"><a class="skip" href="#main">跳转到实验结果</a><aside class="rail"></aside><main id="main"><div class="content"><div class="heading"><div><h1>实验结果</h1></div><span id="sync-status" role="status">正在连接本机服务</span></div><div id="message" class="message" role="status" hidden></div><p id="overview-scope" class="field-hint"></p>    <section class="metrics" aria-label="实验概览指标">
      <article class="metric budget-metric"><div class="metric-label">累计已报告模型用量 · tokens</div><div class="metric-value" id="tokens">—</div><div class="budget-track" role="progressbar" aria-label="Token 报警线占比" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="budget-fill"></span></div><div class="metric-bottom"><span id="budget-caption">报警线 100M</span><span id="budget-percent">—</span></div><p id="unknown-note" class="micro">按本工作区实验归档统计</p></article>
      <article class="metric"><div class="metric-label">已归档实验</div><div class="metric-value" id="runs-count">—</div><div class="metric-bottom"><span id="cases-count">等待归档数据</span></div></article>
      <article class="metric"><div class="metric-label">执行成功率</div><div class="metric-value" id="execution-rate">—</div><div class="metric-bottom"><span id="execution-fraction">尚无已归档结果</span></div></article>
      <article class="metric"><div class="metric-label">Mortal 一选匹配率</div><div class="metric-value" id="match-rate">—</div><div class="metric-bottom"><span id="match-fraction">尚无已归档评分</span></div></article>
    </section>
    <section class="panel results-panel" id="results" aria-labelledby="results-title"><div class="panel-heading"><h2 id="results-title" class="sr-only">实验结果</h2><div class="filters" aria-label="结果筛选"><button class="filter selected" data-filter="all" aria-pressed="true">全部</button><button class="filter" data-filter="local" aria-pressed="false">Local</button><button class="filter" data-filter="off" aria-pressed="false">Off</button><button class="filter" data-filter="fault" aria-pressed="false">受控故障</button></div></div>
      <label class="result-type-label">实验类型<select id="results-type"><option value="all" selected>全部实验</option><option value="mistakes">错题重跑</option><option value="generated">生成题库</option><option value="flat">平面何切</option><option value="spatial">立体何切</option><option value="legacy">旧版混合题库</option><option value="holdout">独立牌局验收</option></select></label>
      <p id="metric-scope" class="sr-only"></p>
      <div id="results-body" class="result-loading">正在读取实验归档…</div>
      <nav id="results-pagination" class="compact-pager" aria-label="实验结果翻页" hidden><button id="prev-results" class="quiet-button">上一页</button><span id="results-page" role="status"></span><button id="next-results" class="quiet-button">下一页</button></nav><details class="result-footnote"><summary>查看统计口径</summary><span>执行成功率含失败；匹配率仅统计成功案例。未知用量不按零计算。</span><span>样本状态 <b>开发与独立牌局验收分开统计</b></span></details>
    </section>
<section id="result-detail" class="panel inline-result" hidden aria-labelledby="detail-title"><div class="dialog-heading"><h2 id="detail-title" tabindex="-1">实验详情</h2><a class="quiet-button" href="/results">返回结果列表</a></div><div id="detail-body"></div></section></div></main></body></html>
